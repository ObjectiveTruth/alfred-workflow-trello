name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  release:
    needs: check
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether this version was already released
        id: version
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :version' alfred/info.plist)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; leaving the release unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: trello-inbox
          path: dist
      - name: Publish immutable version
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          cd dist
          shasum -a 256 -c checksums.txt
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Trello Inbox $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            dist/Trello-Inbox.alfredworkflow dist/checksums.txt \
            --verify-tag --title "Trello Inbox $RELEASE_TAG" --generate-notes
